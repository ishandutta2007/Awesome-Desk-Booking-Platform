<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.3; }
        50% { transform: scale(1.08); opacity: 0.7; }
        100% { transform: scale(0.95); opacity: 0.3; }
      }
      @keyframes dashScan {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .animated-bg-card1 { animation: floatSlow 7s ease-in-out infinite; }
      .animated-bg-card2 { animation: floatReverse 9s ease-in-out infinite; }
      .pulse-ring { transform-origin: center; animation: pulseRing 4s ease-in-out infinite; }
      .scan-line { stroke-dasharray: 20, 10; animation: dashScan 15s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16"/>

  <!-- Background Dynamic Mesh Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="350" y1="0" x2="350" y2="420"/>
    <line x1="550" y1="0" x2="550" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="950" y1="0" x2="950" y2="420"/>
    <line x1="1150" y1="0" x2="1150" y2="420"/>
  </g>

  <!-- Background Dynamic Floating Elements (Behind Foreground Text) -->
  <g class="pulse-ring" opacity="0.4">
    <circle cx="980" cy="140" r="120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,6"/>
    <circle cx="980" cy="140" r="70" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  </g>

  <!-- Decorative Floor Plan Desk Layout Graphics in Background Right -->
  <g class="animated-bg-card1" opacity="0.35" transform="translate(860, 80)">
    <rect x="0" y="0" width="260" height="170" rx="12" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Desks -->
    <rect x="25" y="25" width="45" height="30" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="80" y="25" width="45" height="30" rx="4" fill="#818cf8" opacity="0.6"/>
    <rect x="135" y="25" width="45" height="30" rx="4" fill="#34d399" opacity="0.9"/>
    <rect x="190" y="25" width="45" height="30" rx="4" fill="#38bdf8" opacity="0.5"/>

    <rect x="25" y="115" width="45" height="30" rx="4" fill="#38bdf8" opacity="0.5"/>
    <rect x="80" y="115" width="45" height="30" rx="4" fill="#34d399" opacity="0.9"/>
    <rect x="135" y="115" width="45" height="30" rx="4" fill="#f43f5e" opacity="0.7"/>
    <rect x="190" y="115" width="45" height="30" rx="4" fill="#818cf8" opacity="0.8"/>

    <!-- Central Meeting Table -->
    <rect x="60" y="68" width="140" height="34" rx="6" fill="rgba(255, 255, 255, 0.1)" stroke="#38bdf8" stroke-width="1"/>
    <text x="130" y="89" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">RESERVED</text>
  </g>

  <g class="animated-bg-card2" opacity="0.25" transform="translate(780, 240)">
    <rect x="0" y="0" width="220" height="120" rx="10" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
    <path d="M 20 80 Q 70 30 120 60 T 200 20" fill="none" stroke="#38bdf8" stroke-width="2.5" class="scan-line"/>
    <circle cx="120" cy="60" r="5" fill="#34d399"/>
    <text x="130" y="64" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">94.2% Occupancy</text>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and crystal clarity) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="370" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <circle cx="18" cy="16" r="5" fill="#38bdf8" filter="url(#glow)"/>
      <text x="32" y="21" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">🏢 AWESOME WORKSPACE RESOURCE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome Desk Booking Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Curated List of SaaS Platforms, Hot Desking Tools &amp; Open-Source Systems
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 245)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="125" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">⚡ Hot Desking</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(137, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">🗺️ Floor Plans</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(294, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">📊 Analytics &amp; SSO</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(471, 0)">
        <rect x="0" y="0" width="155" height="34" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
        <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🐳 Self-Hosted OS</text>
      </g>
    </g>

    <!-- Footer Stats / Highlights -->
    <g transform="translate(0, 325)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
        CATEGORIES &amp; INSIGHTS:
      </text>
      <text x="160" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        10 Top SaaS Leaders • 8 Featured Open-Source Repos • Market Size: $1.2B (2026)
      </text>
    </g>
  </g>
</svg>
